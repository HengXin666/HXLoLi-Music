<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HX 验收台</title>
<style>
:root{
  --bg:#0f1216;--panel:#161b21;--panel2:#1b2129;--line:#252d37;--line2:#2f3946;
  --fg:#e4e9ef;--dim:#8b97a5;--faint:#5d6875;--acc:#7cc4ff;--ok:#6fd58a;--warn:#ffcf6e;--bad:#ff8a7a;
  --pink:#ff9ecb;--violet:#b9a2ff;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 500px at 10% -10%,#1a2230 0,transparent 60%),var(--bg);color:var(--fg);
  font:14px/1.55 system-ui,-apple-system,"Noto Sans SC","PingFang SC",sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
.wrap{max-width:1280px;margin:0 auto;padding:28px 28px 60px}
header{display:flex;align-items:center;gap:18px;margin-bottom:26px}
.logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#7cc4ff,#b9a2ff 55%,#ff9ecb);
  display:grid;place-items:center;font-weight:800;color:#0f1216;font-size:15px;letter-spacing:-.5px}
h1{font-size:20px;margin:0;font-weight:650;letter-spacing:.2px}
.sub{color:var(--dim);font-size:12.5px;margin-top:2px}
.grow{flex:1}
.search{background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:8px 12px;color:var(--fg);width:260px;font:inherit;outline:none}
.search:focus{border-color:#4d7fa8}
.live{display:flex;align-items:center;gap:7px;color:var(--dim);font-size:12px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(111,213,138,.15)}
.dot.off{background:var(--bad);box-shadow:0 0 0 3px rgba(255,138,122,.15)}
h2{font-size:13px;font-weight:600;color:var(--dim);letter-spacing:.08em;margin:30px 0 12px;display:flex;align-items:baseline;gap:10px}
h2 small{font-weight:400;letter-spacing:0;color:var(--faint)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;
  transition:border-color .15s,transform .15s;display:flex;flex-direction:column;gap:10px;min-height:150px}
.card:hover{border-color:#3a4a5d;transform:translateY(-1px)}
.card .anime{color:var(--dim);font-size:12px}
.card .song{font-size:17px;font-weight:650;line-height:1.3;word-break:break-word}
.card .song a:hover{color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:999px;background:#212934;color:#a9b6c4;border:1px solid #2a3440;white-space:nowrap}
.chip.kfx{color:var(--violet);border-color:#3b3360;background:#221f36}
.chip.ok{color:var(--ok);border-color:#2a4a34;background:#17261c}
.chip.bad{color:var(--bad);border-color:#5a2e2a;background:#2a1817}
.chip.run{color:var(--warn);border-color:#5a4a26;background:#2a2416}
.chip.eye{color:var(--acc);border-color:#284660;background:#16222e}
.foot{margin-top:auto;display:flex;align-items:center;gap:8px}
.meta{color:var(--faint);font-size:12px}
.btn{border:1px solid var(--line2);background:#1d242d;color:var(--fg);border-radius:8px;padding:5px 12px;font:inherit;font-size:12.5px;cursor:pointer}
.btn:hover{border-color:#4d6075}
.btn.pri{background:#2b5f8a;border-color:#3d79a8}
.btn.pri:hover{background:#346f9f}
.btn:disabled{opacity:.5;cursor:default}
.err{font-size:12px;color:var(--bad);background:#24171a;border:1px solid #4a2626;border-radius:8px;padding:6px 8px;white-space:pre-wrap;max-height:84px;overflow:auto}
.lib{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.grp{display:grid;grid-template-columns:170px 1fr;border-top:1px solid var(--line)}
.grp:first-child{border-top:0}
.gname{padding:14px 16px;color:var(--dim);font-size:12.5px;border-right:1px solid var(--line);background:#141920}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr auto auto auto;gap:14px;align-items:center;padding:10px 16px;border-top:1px solid #1e252e}
.row:first-child{border-top:0}
.row:hover{background:#1a2028}
.row .t{font-weight:550;word-break:break-word}
.row .t:hover{color:var(--acc)}
.tag{font-size:11px;padding:1px 7px;border-radius:5px;white-space:nowrap}
.k-human{background:#1d2b22;color:#8fe0a6}
.k-assfx,.k-kara,.k-gen{background:#2a2630;color:#c8b6e6}
.k-kfx{background:#221f36;color:var(--violet)}
.k-draft{background:#2e2717;color:var(--warn)}
.k-tpl{background:#17242e;color:#8cc8f0}
.na{color:var(--faint);font-size:12px}
.empty{color:var(--faint);padding:30px;text-align:center}
kbd{font:11px ui-monospace,monospace;background:#202833;border:1px solid #2c3743;border-radius:4px;padding:0 5px;color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">HX</div>
    <div>
      <h1>验收台</h1>
      <div class="sub">每首歌单独一个标签页, 可以同时开. 设计稿一改, 正在看的那首自动重建; 改 kfx 代码不用重启.</div>
    </div>
    <div class="grow"></div>
    <input class="search" id="q" placeholder="搜歌名 / 番名   /" autocomplete="off">
    <div class="live"><span class="dot" id="dot"></span><span id="live">在线</span></div>
  </header>

  <h2>在做的工程 <small>dev/&lt;番&gt;/&lt;歌&gt;</small></h2>
  <div class="grid" id="proj"></div>

  <h2>发布库 <small>static/music · 只读, 没有视频也照样渲染字幕 (用来看人做的, 对比老版本)</small></h2>
  <div class="lib" id="lib"><div class="empty">读取中…</div></div>
</div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let P = [], L = [], q = '';
const hit = (x) => !q || (x.anime + ' ' + x.song).toLowerCase().includes(q);
function ago(ts) {
  if (!ts) return '';
  const s = Date.now() / 1000 - ts;
  if (s < 60) return '刚刚';
  if (s < 3600) return Math.round(s / 60) + ' 分钟前';
  if (s < 86400) return Math.round(s / 3600) + ' 小时前';
  return Math.round(s / 86400) + ' 天前';
}
function card(p) {
  const b = p.last_build;
  let st = '';
  if (p.building) st = '<span class="chip run">重建中…</span>';
  else if (b && b.ok) st = `<span class="chip ok">✓ 重建 ${b.ms} ms · ${esc(p.last_build_at)}</span>`;
  else if (b && !b.ok) st = `<span class="chip bad">✗ 重建失败 · ${esc(p.last_build_at)}</span>`;
  if (p.stale && !p.building) st += '<span class="chip run" title="设计稿或 kfx 代码比成品新">待重建</span>';
  const err = b && !b.ok && b.errors && b.errors.length ? `<div class="err">${esc(b.errors.slice(0, 4).join('\n'))}</div>` : '';
  return `<div class="card">
    <div><div class="anime">${esc(p.anime)}</div><div class="song"><a href="${p.url}" target="_blank">${esc(p.song)}</a></div></div>
    <div class="chips">
      <span class="chip ${p.kfx ? 'kfx' : ''}">${esc(p.ass)}</span>
      ${p.size_mb != null ? `<span class="chip">${p.size_mb} MB</span>` : '<span class="chip bad">还没有成品</span>'}
      ${p.viewers ? `<span class="chip eye">● ${p.viewers} 人在看</span>` : ''}
      ${st}
    </div>
    ${err}
    <div class="foot">
      <span class="meta">${p.mtime_ts ? '成品 ' + ago(p.mtime_ts) : ''}</span><span class="grow"></span>
      ${p.kfx ? `<button class="btn" data-u="${p.url}" onclick="rb(this)">重建</button>` : ''}
      <a class="btn pri" href="${p.url}" target="_blank">打开</a>
    </div>
  </div>`;
}
function kindTag(r) {
  const m = { '人做 (Aegisub)': 'k-human', 'AI assfx': 'k-assfx', 'AI hx-kara': 'k-kara', 'AI kfx': 'k-kfx' };
  let s = `<span class="tag ${m[r.kind] || 'k-gen'}">${esc(r.kind)}</span>`;
  if (r.template) s += ' <span class="tag k-tpl" title="ASS 里留着 Aegisub 模板源码 (Comment 行), 设计可以直接读">带模板源码</span>';
  if (r.draft) s += ' <span class="tag k-draft">草稿</span>';
  return s;
}
function renderProj() {
  const xs = P.filter(hit);
  $('#proj').innerHTML = xs.length ? xs.map(card).join('') : '<div class="empty">没有匹配的工程</div>';
}
function renderLib() {
  const xs = L.filter(hit);
  if (!xs.length) { $('#lib').innerHTML = '<div class="empty">没有匹配的歌</div>'; return; }
  const g = {};
  for (const r of xs) (g[r.anime] = g[r.anime] || []).push(r);
  $('#lib').innerHTML = Object.keys(g).map((a) => `<div class="grp"><div class="gname">${esc(a)}</div><div class="rows">${
    g[a].map((r) => `<div class="row">
      <a class="t" href="${r.url}" target="_blank">${esc(r.song)}</a>
      <span>${kindTag(r)}</span>
      <span class="na">${r.audio ? '' : '无音频 · '}${r.size_mb} MB</span>
      <a class="btn" href="${r.url}" target="_blank">打开</a></div>`).join('')}</div></div>`).join('');
}
async function load() {
  try {
    P = (await (await fetch('/api/projects')).json()).projects;
    $('#dot').className = 'dot'; $('#live').textContent = '在线';
    renderProj();
  } catch { $('#dot').className = 'dot off'; $('#live').textContent = '服务未连接'; }
}
async function loadLib() {
  try { L = (await (await fetch('/api/library')).json()).library; renderLib(); } catch { $('#lib').innerHTML = '<div class="empty">读不到发布库</div>'; }
}
async function rb(b) {
  b.disabled = true; b.textContent = '重建中…';
  try {
    const r = await fetch(b.dataset.u + 'api/rebuild', { method: 'POST' });
    const j = await r.json().catch(() => ({}));
    if (!r.ok && j.error) alert(j.error);
  } finally { load(); }
}
$('#q').addEventListener('input', (e) => { q = e.target.value.trim().toLowerCase(); renderProj(); renderLib(); });
addEventListener('keydown', (e) => { if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); } });
load(); loadLib(); setInterval(load, 3000);
</script>
</body>
</html>
