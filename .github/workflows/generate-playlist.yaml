name: "[LoLi-Music]: 自动生成播放列表"

on:
  push:
    branches: [main]
    paths:
      - 'static/music/**'
      - 'py/music/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  # --- Job 1: 生成并提交 playlist.json ---
  generate-playlist:
    # 跳过 Bot 自己的提交, 避免无限循环
    if: |
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[LoLi-Bot]')
    runs-on: ubuntu-latest
    outputs:
      changes_detected: ${{ steps.auto-commit.outputs.changes_detected }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 启用 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: 安装 uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: 安装 Python 依赖
        run: |
          source $HOME/.cargo/env
          uv sync
        working-directory: ./py

      - name: 生成 playlist.json
        run: |
          source $HOME/.cargo/env
          uv run python -m music.gen_music_playlist
        working-directory: ./py
        env:
          PYTHONUNBUFFERED: "1"

      - name: 召唤 萝莉小猫娘 帮忙 push
        id: auto-commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '[LoLi-Bot]: ご主人さま、プレイリストを更新しましたにゃ♪'
          commit_user_name: 'Heng_Xin[LoLi-Bot]'
          commit_user_email: '282000500@qq.com'
          commit_author: 'Heng_Xin[LoLi-Bot] <282000500@qq.com>'
          file_pattern: 'playlist.json .playlist_cache.json static/music/** static/info/**'

      # Bot commit 完成后, 触发 cdn-tag 打 tag (确保 tag 包含最新数据)
      - name: 🏷️ 触发 CDN Tag
        if: steps.auto-commit.outputs.changes_detected == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'cdn-tag.yml',
              ref: 'main',
            });
            console.log('✅ 已触发 cdn-tag.yml');

