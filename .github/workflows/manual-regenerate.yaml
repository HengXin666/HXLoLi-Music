name: "🔄 [手动] 清除缓存 & 重新生成播放列表"

on:
  workflow_dispatch:
    inputs:
      clear_cache:
        description: '清除 .playlist_cache.json 缓存'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  regenerate:
    name: 清除缓存 & 生成播放列表 & 触发 CDN Tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 🗑️ 清除播放列表缓存
        if: inputs.clear_cache
        run: |
          if [ -f .playlist_cache.json ]; then
            rm -f .playlist_cache.json
            echo "✅ 已删除 .playlist_cache.json"
          else
            echo "ℹ️ .playlist_cache.json 不存在, 跳过"
          fi

      - name: 启用 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: 安装 uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: 安装 Python 依赖
        run: |
          source $HOME/.cargo/env
          uv sync
        working-directory: ./py

      - name: 🎵 生成 playlist.json
        run: |
          source $HOME/.cargo/env
          uv run python -m music.gen_music_playlist
        working-directory: ./py
        env:
          PYTHONUNBUFFERED: "1"

      - name: 📦 提交变更
        id: auto-commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '[LoLi-Bot]: ご主人さま、プレイリストを手動で再生成しましたにゃ♪'
          commit_user_name: 'Heng_Xin[LoLi-Bot]'
          commit_user_email: '282000500@qq.com'
          commit_author: 'Heng_Xin[LoLi-Bot] <282000500@qq.com>'
          file_pattern: 'playlist.json .playlist_cache.json static/music/** static/info/**'

      - name: 🏷️ 触发 CDN Tag
        if: steps.auto-commit.outputs.changes_detected == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'cdn-tag.yml',
              ref: 'main',
            });
            console.log('✅ 已触发 cdn-tag.yml');
