name: "[LoLi-Music]: 部署到 Cloudflare Workers"

on:
  push:
    branches: [main]
    paths:
      - 'static/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 📦 准备 Worker 部署目录
        run: |
          rm -rf ./cf-assets
          mkdir -p ./cf-assets
          cp -r static ./cf-assets/
          # playlist.json 在仓库根目录, CF Worker 也需要提供 (音乐播放器入口)
          cp playlist.json ./cf-assets/ 2>/dev/null || true
          echo "✅ 部署目录已准备:"
          find ./cf-assets -type f | head -20
          echo "   总文件数: $(find ./cf-assets -type f | wc -l)"

      - name: 🔍 扫描超过 25MB 的文件 (Cloudflare Workers 单文件限制)
        run: |
          OVERSIZED=$(find ./cf-assets -type f -size +25M)
          if [ -z "$OVERSIZED" ]; then
            echo "✅ 没有超过 25MB 的文件"
          else
            echo "⚠️ 以下文件超过 25MB, 需要切片处理:"
            echo "$OVERSIZED" | while read -r file; do
              echo "   ⚠️ $file ($(du -h "$file" | cut -f1))"
            done
            # 不直接删除, 由 hx-cdn-forge 的切片机制处理
          fi

      - name: ✍️ 生成 wrangler.toml 和 _headers
        run: |
          cat > wrangler.toml << 'EOF'
          name = "hxloli-music"
          compatibility_date = "2024-09-23"

          [assets]
          directory = "./cf-assets"
          EOF

          # Cloudflare Workers Static Assets 原生支持 _headers 文件
          cat > cf-assets/_headers << 'HEADERSEOF'
          /*
            Access-Control-Allow-Origin: *
            Access-Control-Allow-Methods: GET, HEAD, OPTIONS
            Access-Control-Allow-Headers: *
          HEADERSEOF

          echo "✅ wrangler.toml 和 _headers 已生成"

      - name: 🚀 部署到 Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
